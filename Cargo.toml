[package]
name = "lodd"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "lodd"
path = "main.rs"

[[bin]]
name = "tiffmerge"
path = "poc/tiffmerge.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
terrio = { version = "0.8.0", default-features = false, features = ["geotiff"] }

# Optimaliser avhengigheter også i debug (egen kode forblir debug-vennlig)
# Unngår potensiell stackoverflow-feil i Windows
[profile.dev.package."*"]
opt-level = 1